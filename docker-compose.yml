# 本地数据库编排：PostgreSQL（含 pgvector）+ Qdrant。
#
# 前置：安装 Docker Desktop（Windows 用 WSL2 后端）。
# 启动：  docker compose up -d
# 停止：  docker compose down
# 清空并重建（会丢数据）： docker compose down -v
#
# 连接参数与项目根目录 .env 保持一致（DB_HOST=localhost，端口 5432/6333）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agents-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
