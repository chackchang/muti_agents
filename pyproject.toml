[project]
name = "agents"
version = "0.1.0"
description = "A simple agent to fetch and extract text from dynamic websites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.32.0",
    "docling>=2.142.0",
    "langchain-text-splitters>=1.1.3",
    "magic-pdf[full]>=0.6.1",
    "openai>=3.37.0",
    "playwright>=1.49",
    "pydantic-ai>=2.54.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.12.0",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
embedding = [
    "flagembedding>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "network: 需要真实互联网访问",
]
